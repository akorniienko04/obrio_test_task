[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-store-review-analysis"
version = "0.1.0"
description = "REST API for collecting and cleaning Apple App Store reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "transformers>=4.41,<6.0",
    "torch>=2.2,<3.0",
    "sentencepiece>=0.2,<1.0",
    "protobuf>=4.25,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
